# PR-Agent review and security check for HERISLAB.
# The logic, models and cost guards live in ryanflash66/shared-workflows; this file
# only picks the research security profile and this repo's review focus.
name: PR Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: ryanflash66/shared-workflows/.github/workflows/pr-agent.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets:
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
    with:
      profile: research
      focus: |
        This is a research codebase: a convolutional autoencoder for thermal anomaly detection.
        Prioritize, in order:
        - train/test leakage (same image, plot or source on both sides of a split)
        - metric or threshold mistakes (AUROC, F1, precision/recall, how thresholds are picked)
        - preprocessing that differs between normal and fault images or between train and eval
        - reproducibility: fixed seeds, configs read from config/, no hard-coded local paths
        - numbers in README or docs/paper that the changed code no longer produces
